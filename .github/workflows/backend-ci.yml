name: Backend CI
on:
  pull_request:
    branches: [main]
    paths: ["backend/**", "scripts/export-backend.cjs", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "scripts/export-backend.cjs", ".github/workflows/backend-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bsu
          POSTGRES_PASSWORD: bsu_local_password
          POSTGRES_DB: bsu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bsu -d bsu" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bsu:bsu_local_password@127.0.0.1:5432/bsu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Export the real website data so the round-trip test runs too.
      - run: npm ci
      - run: node scripts/export-backend.cjs
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      # Admin access-policy scenarios (standalone scripts in app/test_*.py, SQLite in memory).
      - run: for f in app/test_*.py; do python -m "app.$(basename "$f" .py)" || exit 1; done
        shell: bash
        working-directory: backend
