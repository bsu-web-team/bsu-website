name: backend

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bsu
          POSTGRES_PASSWORD: bsu
          POSTGRES_DB: bsu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bsu -d bsu_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://bsu:bsu@localhost:5432/bsu_test
      TEST_DATABASE_URL: postgresql+asyncpg://bsu:bsu@localhost:5432/bsu_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest -q
