# BSU staging server: PostgreSQL + API + website + Caddy on port 80.
# Use ./deploy.sh (see README.md); it starts services in the right order.
name: bsu-staging

x-api-root: &api-internal http://api:8000/api/v1

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/staging/.env}
      POSTGRES_DB: bsu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsu -d bsu"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the api container can reach the database.

  api:
    build: ../../backend
    image: bsu-api:staging
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bsu:${POSTGRES_PASSWORD}@db:5432/bsu
      ENABLE_DOCS: "true"
      WEB_CONCURRENCY: ${API_WORKERS:-2}
    # Host-only (127.0.0.1): used while building the website and for SSH tunnels.
    # Not reachable from the network.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../../backend-export:/export:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../..
      # The build prerenders pages from the API published on the host above.
      network: host
      args:
        BSU_DATA_SOURCE: backend
        BSU_CONTENT_SOURCE: backend
        BSU_API_BASE_URL: http://127.0.0.1:${API_PORT:-8000}/api/v1
        BSU_API_REVALIDATE_SECONDS: ${BSU_API_REVALIDATE_SECONDS:-300}
        BSU_UNIT_PUBLICATION_BASE_URL: http://127.0.0.1:${API_PORT:-8000}/api/v1
    image: bsu-web:staging
    restart: unless-stopped
    init: true
    environment:
      BSU_DATA_SOURCE: backend
      BSU_CONTENT_SOURCE: backend
      BSU_API_BASE_URL: *api-internal
      BSU_API_REVALIDATE_SECONDS: ${BSU_API_REVALIDATE_SECONDS:-300}
      BSU_UNIT_PUBLICATION_BASE_URL: *api-internal
      # Admin stays disabled: it requires BSU_ADMIN_PRODUCTION_ENABLED=true and an HTTPS admin API.
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
